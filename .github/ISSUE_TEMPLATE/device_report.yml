name: Device report
description: Tell us how the plugin worked on your device, good or bad
title: "Device report: "
labels: ["device report"]
body:
  - type: input
    id: device
    attributes:
      label: Device and model
      placeholder: Kindle Paperwhite 5
    validations:
      required: true
  - type: input
    id: koreader
    attributes:
      label: KOReader version
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where is `statistics.sqlite3` on the device?
      placeholder: koreader/settings/statistics.sqlite3
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: calibre
    attributes:
      label: calibre and plugin versions
      placeholder: calibre 7.21, plugin 1.4.0
    validations:
      required: true
  - type: dropdown
    id: copied
    attributes:
      label: Were statistics copied when the device connected?
      options: ["Yes", "No", "Didn't try"]
    validations:
      required: true
  - type: dropdown
    id: write
    attributes:
      label: Did you change records on the device with the clock pop-up?
      options: ["No, it didn't come up", "No, I chose not to", "Yes, and KOReader showed the new dates", "Yes, and something went wrong"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
